<section>

    <span data-text="items_per_row"><span data-text="items_per_row_option_sub_label" class="subLabel"></span></span>
    <input type="checkbox" id="videosPerRow">
  </label>
  <div class="expandable">
    <label section="header">
      <h4 data-text="videos"></h4>
    </label>
    <label section="content">
      <span data-text="max_num_of_cols"></span>
      <button role="combobox" aria-haspopup="listbox" class="selectMenu openPopup rotableArrow" id="maxNumOfColumns">
        <span>6</span>
        <ul role="listbox">
          <li role="option" value="1">1</li>
          <li role="option" value="2">2</li>
          <li role="option" value="3">3</li>
          <li role="option" value="4">4</li>
          <li role="option" value="5">5</li>

          <li role="option" value="8">8</li>
          <li role="option" value="9">9</li>
          <li role="option" value="10">10</li>
          <li role="option" value="11">11</li>
          <li role="option" value="12">12</li>
          <li role="option" value="13">13</li>
          <li role="option" value="14">14</li>
          <li role="option" value="15">15</li>
        </ul>
      </button>
    </label>
    <label section="content">
      <span data-text="min_col_width">(px)</span>
      <input type="number" id="minColumnWidth" value="270">
      <button class="numInputBtn minus"></button>
      <button class="numInputBtn plus"></button>
    </label>
    <label section="header">
      <h4 data-text="shorts"></h4>
    </label>
    <label section="content">
      <span data-text="max_num_of_cols"></span>
      <button role="combobox" aria-haspopup="listbox" class="selectMenu openPopup rotableArrow" id="maxNumOfColumns2">
        <span>12</span>
        <ul role="listbox">
          <li role="option" value="1">1</li>
          <li role="option" value="2">2</li>
          <li role="option" value="3">3</li>
          <li role="option" value="4">4</li>
          <li role="option" value="5">5</li>
          <li role="option" value="6">6</li>
          <li role="option" value="7">7</li>
          <li role="option" value="8">8</li>
          <li role="option" value="9">9</li>
          <li role="option" value="10">10</li>
          <li role="option" value="11">11</li>
          <li role="option" value="12" aria-selected="true">12</li>
        </ul>
      </button>
    </label>
    <label section="content">
      <span data-text="min_col_width">(px)</span>
      <input type="number" id="minColumnWidth2" value="170">
      <button class="numInputBtn minus"></button>
      <button class="numInputBtn plus"></button>
    </label>
    <label section="header">
      <h4 data-text="posts"></h4>
    </label>
    <label section="content">
      <span data-text="max_num_of_cols"></span>
      <button role="combobox" aria-haspopup="listbox" class="selectMenu openPopup rotableArrow" id="maxNumOfColumns3">
        <span>6</span>
        <ul role="listbox">
          <li role="option" value="1">1</li>
          <li role="option" value="2">2</li>
          <li role="option" value="3">3</li>
          <li role="option" value="4">4</li>
          <li role="option" value="5">5</li>
          <li role="option" value="6" aria-selected="true">6</li>
        </ul>
      </button>
    </label>
    <label section="content">
      <span data-text="min_col_width">(px)</span>
      <input type="number" id="minColumnWidth3" value="326">
      <button class="numInputBtn minus"></button>

  <label>
    <span data-text="hide_profile_pictures"></span>
    <input type="checkbox" id="hideProfilePictures">

  <label>
    <span data-text="decrease_font_size"></span>
