<section>
  <label>
    <span data-text="navigate_to_wl_page"></span>
    <button is="set-hotkey" id="redToWatchLaterHotkey">
    </button>
  </label>
  <label>
    <span data-text="more_animations"></span>
    <input type="checkbox" id="moreAnimations">
  </label>
  <div class="expandable">
    <label>
      <span data-text="speed"> (<span data-text="seconds"></span>)</span>
      <input is="number-box" type="number" id="maAnimationsSpeed" min="0" step="0.01" value="0.75">
    </label>
  </div>
  <label>
    <span data-text="red_subscribe_button"></span>
    <input type="checkbox" id="redSubscribeButton">
  </label>
</section>
<section>
  <h4 data-text="video_metadata"></h4>
  <label>
    <span data-text="show_full_video_title"></span>
    <input type="checkbox" id="showFullVideoTitles">
  </label>
  <label>
    <span data-text="show_full_channel_name_and_upload_time"></span>
    <input type="checkbox" id="showFullInfoBelowVideoTitle">
  </label>
</section>
<section>
  <h4 data-text="back_to_top"></h4>
  <label>
    <span data-text="show_back_to_top_button"></span>
    <button is="select-button" id="scrollUpButton">
      <ul>
        <li value data-text="off"></li>
        <li value="On the right" data-text="bottom_right"></li>
        <li value="On the left" data-text="bottom_left"></li>
        <li value="Centered" data-text="bottom_center"></li>
      </ul>
    </button>
  </label>
  <div class="expandable">
    <label>
      <span data-text="color"></span>
      <button is="color-picker" id="scrollUpBtnColor" value="hsla(0, 0%, 95%, 1)">
      </button>
    </label>
    <label>
      <span data-text="icon"></span>
      <button is="color-picker" id="scrollUpBtnSvgColor" value="hsla(0, 0%, 6%, 1)">
      </button>
    </label>
    <label>
      <span data-text="size"> (px)</span>
      <input is="number-box" type="number" id="scrollUpBtnWidth" value="36">
    </label>
    <label>
      <span data-text="rounded_corners"> (px)</span>
      <input is="number-box" type="number" id="scrollUpBtnRoundCorners" min="0" value="18">
    </label>
  </div>
  <label>
    <span data-text="scroll_back_to_top"></span>
    <button is="set-hotkey" id="scrollToTopHotkey">
    </button>
  </label>
</section>
