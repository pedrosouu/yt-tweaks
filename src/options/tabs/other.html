<section>
  <label>
    <span data-text="navigate_to_wl_page"></span>
    <button class="keyBinder openPopup" placeholder="set_hotkey" id="redToWatchLaterHotkey">
    </button>
  </label>
  <label>
    <span data-text="more_animations"></span>
    <input type="checkbox" id="moreAnimations">
  </label>
  <div class="expandable">
    <label>
      <span data-text="speed"> (<span data-text="seconds"></span>)</span>
      <input type="number" id="maAnimationsSpeed" min="0" step="0.01" value="0.75">
      <button class="numInputBtn minus"></button>
      <button class="numInputBtn plus"></button>
    </label>
  </div>
  <label>
    <span data-text="red_subscribe_button"></span>
    <input type="checkbox" id="redSubscribeButton">
  </label>
</section>
<section>
  <h4 data-text="video_metadata"></h4>
  <label>
    <span data-text="show_full_video_title"></span>
    <input type="checkbox" id="showFullVideoTitles">
  </label>
  <label>
    <span data-text="show_full_channel_name_and_upload_time"></span>
    <input type="checkbox" id="showFullInfoBelowVideoTitle">
  </label>
</section>
<section>
  <h4 data-text="back_to_top"></h4>
  <label>
    <span data-text="show_back_to_top_button"></span>
    <button role="combobox" aria-haspopup="listbox" class="selectMenu openPopup rotableArrow" id="scrollUpButton">
      <span data-text="off"></span>
      <ul role="listbox">
        <li role="option" value data-text="off"></li>
        <li role="option" value="On the right" data-text="bottom_right"></li>
        <li role="option" value="On the left" data-text="bottom_left"></li>
        <li role="option" value="Centered" data-text="bottom_center"></li>
      </ul>
    </button>
  </label>
  <div class="expandable">
    <label>
      <span data-text="color"></span>
      <button class="colorPicker openPopup" id="scrollUpBtnColor" style="--selectedColor: hsla(0, 0%, 95%, 1);">
        <div class="checker"></div>
        <div class="selectedColor"></div>
      </button>
    </label>
    <label>
      <span data-text="icon"></span>
      <button class="colorPicker openPopup" id="scrollUpBtnSvgColor" style="--selectedColor: hsla(0, 0%, 6%, 1);">
        <div class="checker"></div>
        <div class="selectedColor"></div>
      </button>
    </label>
    <label>
      <span data-text="size"> (px)</span>
      <input type="number" id="scrollUpBtnWidth" value="36">
      <button class="numInputBtn minus"></button>
      <button class="numInputBtn plus"></button>
    </label>
    <label>
      <span data-text="rounded_corners"> (px)</span>
      <input type="number" id="scrollUpBtnRoundCorners" min="0" value="18">
      <button class="numInputBtn minus"></button>
      <button class="numInputBtn plus"></button>
    </label>
  </div>
  <label>
    <span data-text="scroll_back_to_top"></span>
    <button class="keyBinder openPopup" placeholder="set_hotkey" id="scrollToTopHotkey">
    </button>
    <button class="removeSetting" title="delete" aria-label="delete">
    </button>
  </label>
</section>
