<section>
  <label>
    <span data-text="navigate_to_homepage"></span>
    <button class="keyBinder openPopup" placeholder="set_hotkey" id="redToHomeHotkey">
    </button>
    <button class="removeSetting" title="delete" aria-label="delete">
    </button>
  </label>
</section>
<section>
  <h4 data-text="hide"></h4>
  <label>
    <span data-text="shorts"></span>
    <input type="checkbox" id="hideShorts">
  </label>
  <label>
    <span data-text="mixes"></span>
    <input type="checkbox" id="hideMixes">
  </label>
  <label>
    <span data-text="live_streams"></span>
    <button class="selectMenu openPopup rotableArrow" id="hideLiveStreams" role="combobox" aria-haspopup="listbox">
      <span data-text="off"></span>
      <ul role="listbox">
        <li value data-text="off"></li>
        <li value="current" data-text="current_live_streams"></li>
        <li value="completed" data-text="completed_live_streams"></li>
        <li value="both" data-text="both_live_streams"></li>
      </ul>
    </button>
  </label>
  <label>
    <span data-text="upcoming_videos"></span>
    <input type="checkbox" id="hideUpcoming">
  </label>
  <label>
    <span data-text="topic_bar"></span>
    <input type="checkbox" id="hideRecommendationBar">
  </label>
  <label>
    <span data-text="latest_yt_Posts"></span>
    <input type="checkbox" id="hideLatestYouTubePosts">
  </label>
</section>
<section>
  <h4 data-text="watched_videos"></h4>
  <label>
    <span data-text="hide"></span>
    <button role="combobox" aria-haspopup="listbox" class="selectMenu openPopup rotableArrow" id="hideWatchVideos">
      <span data-text="off"></span>
      <ul role="listbox">
        <li role="option" value data-text="off"></li>
        <li role="option" value="All videos" data-text="watched_percentage">0-100</li>
        <li role="option" value="50-100%" data-text="watched_percentage">50-100</li>
        <li role="option" value="70-100%" data-text="watched_percentage">70-100</li>
        <li role="option" value="75-100%" data-text="watched_percentage">75-100</li>
        <li role="option" value="80-100%" data-text="watched_percentage">80-100</li>
        <li role="option" value="85-100%" data-text="watched_percentage">85-100</li>
        <li role="option" value="90-100%" data-text="watched_percentage">90-100</li>
        <li role="option" value="95-100%" data-text="watched_percentage">95-100</li>
        <li role="option" value="Only fully-watched videos" data-text="watched_percentage">100</li>
      </ul>
    </button>
  </label>
  <label>
    <span data-text="dim"></span>
    <button role="combobox" aria-haspopup="listbox" class="selectMenu openPopup rotableArrow" id="dimWatchVideos">
      <span data-text="off"></span>
      <ul role="listbox">
        <li role="option" value data-text="off"></li>
        <li role="option" value="dimAllVideos" data-text="watched_percentage">0-100</li>
        <li role="option" value="50-100%" data-text="watched_percentage">50-100</li>
        <li role="option" value="70-100%" data-text="watched_percentage">70-100</li>
        <li role="option" value="75-100%" data-text="watched_percentage">75-100</li>
        <li role="option" value="80-100%" data-text="watched_percentage">80-100</li>
        <li role="option" value="85-100%" data-text="watched_percentage">85-100</li>
        <li role="option" value="90-100%" data-text="watched_percentage">90-100</li>
        <li role="option" value="95-100%" data-text="watched_percentage">95-100</li>
        <li role="option" value="dimFullyWatchVideos" data-text="watched_percentage">100</li>
      </ul>
    </button>
  </label>
  <div class="expandable">
    <label>
      <span data-text="opacity"></span>
      <input type="number" id="watchVideoOpacity" step="0.01" min="0" max="1" value="0.3">
      <button class="numInputBtn minus"></button>
      <button class="numInputBtn plus"></button>
    </label>
  </div>
</section>
