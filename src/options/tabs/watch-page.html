<section>
  <label>
    <span data-text="video_description"></span>
    <button class="selectMenu openPopup rotableArrow" id="videoDescription">
      <span data-text="default"></span>
      <ul>
        <li value data-text="default"></li>
        <li value="Minimalist" data-text="minimalist_video_description"></li>
        <li value="Expanded" data-text="expanded_video_description"></li>
      </ul>
    </button>
  </label>
  <label>
    <span data-text="clickable_channel_names"></span>
    <input type="checkbox" id="fixChannelLinks">
  </label>
</section>
<section>
  <h4 data-text="hotkeys"></h4>
  <label>
    <span data-text="navigate_to_shorts_page"></span>
    <button class="keyBinder openPopup" placeholder="set_hotkey" id="redToShortsHotkey">
    </button>
    <button class="removeSetting">
    </button>
  </label>
  <label>
    <span data-text="toggle_video_transcript"></span>
    <button class="keyBinder openPopup" placeholder="set_hotkey" id="toggleTranscriptHotkey">
    <button class="removeSetting">
    </button>
  </label>
  <label>
    <span data-text="toggle_like"></span>
    <button class="keyBinder openPopup" placeholder="set_hotkey" id="likeUnlikeHotkey">
    </button>
    <button class="removeSetting">
    </button>
  </label>
  <label>
    <span data-text="toggle_dislike"></span>
    <button class="keyBinder openPopup" placeholder="set_hotkey" id="dislikeUndislikeHotkey">
    </button>
    <button class="removeSetting">
    </button>
  </label>
</section>
<section>
  <h4 data-text="live_chat"></h4>
  <label>
    <span data-text="disable_auto_opening_live_chat"></span>
    <input type="checkbox" id="disableAutoOpeningOfLiveChat">
  </label>
  <label>
    <span data-text="default_view"></span>
    <button class="selectMenu openPopup rotableArrow" id="defaultLiveChatView">
      <span data-text="live_chat_view_top_chat"></span>
      <ul>
        <li value data-text="live_chat_view_top_chat"></li>
        <li value="liveChat" data-text="live_chat_view_live_chat"></li>
      </ul>
    </button>
  </label>
</section>
<section>
  <h4 data-text="comments_section"></h4>
  <label>
    <span data-text="auto_expand_long_comments"></span>
    <input type="checkbox" id="autoExpandComments">
  </label>
  <label>
    <span data-text="default_sorting_of_comments"></span>
    <button class="selectMenu openPopup rotableArrow" id="defaultSortingOfComments">
      <span data-text="comments_sorting_top"></span>
      <ul>
        <li value data-text="comments_sorting_top"></li>
        <li value="newest" data-text="comments_sorting_newest"></li>
      </ul>
    </button>
  </label>
  <label section="header">
    <h4 data-text="sidebar"></h4>
  </label>
  <label section="content">
    <span data-text="show_comments_section"></span>
    <input type="checkbox" id="autoSidebarComments">
  </label>
  <label section="content">
    <span data-text="toggle_comments_section"></span>
    <button class="keyBinder openPopup" placeholder="set_hotkey" id="toggleSidebarCommentsHotkey">
    </button>
    <button class="removeSetting">
    </button>
  </label>
  <label section="content">
    <span data-text="height"> (%)</span>
    <input type="number" id="scHeight" min="0" max="100" step="1" value="100">
    <button class="numInputBtn minus iconButton"></button>
    <button class="numInputBtn plus iconButton"></button>
  </label>
  <label section="content">
    <span data-text="use_player_height"></span>
    </span>
    <input type="checkbox" id="scUsePlayerHeight">
  </label>
  <label section="content">
    <span data-text="hide_header"></span>
    </span>
    <input type="checkbox" id="scHideHeader">
  </label>
  <label section="content">
    <span data-text="hide_comment_field"></span>
    </span>
    <input type="checkbox" id="scHideCommentField">
  </label>
</section>
<section>
  <h4 data-text="hide"></h4>
    <label>
      <span data-text="sidebar">: <span data-text="shorts"></span></span>
      <input type="checkbox" id="hideShorts4">
    </label>
    <label>
      <span data-text="sidebar">: <span data-text="mixes"></span></span>
      <input type="checkbox" id="hideMixes2">
    </label>
    <label>
      <span data-text="sidebar">: <span data-text="live_streams"></span></span>
      <button class="selectMenu openPopup rotableArrow" id="hideLiveStreams3">
        <span data-text="off"></span>
        <ul>
          <li value data-text="off"></li>
          <li value="current" data-text="current_live_streams"></li>
          <li value="completed" data-text="completed_live_streams"></li>
          <li value="both" data-text="both_live_streams"></li>
        </ul>
      </button>
    </label>
    <label>
      <span data-text="share_button"></span>
      <input type="checkbox" id="hideShareButton">
    </label>
    <label>
      <span data-text="download_button"></span>
      <input type="checkbox" id="hideDownloadButton">
    </label>
    <label>
      <span data-text="clip_button"></span>
      <input type="checkbox" id="hideClipButton">
    </label>
    <label>
      <span data-text="thanks_button"></span>
      <input type="checkbox" id="hideThanksButton">
    </label>
    <label>
      <span data-text="save_button"></span>
      <input type="checkbox" id="hideSaveButton">
    </label>
    <label>
      <span data-text="button_labels"></span>
      <input type="checkbox" id="compactButtons">
    </label>
</section>
<section>
  <h4 data-text="watched_videos"></h4>
  <label>
    <span data-text="sidebar">: <span data-text="hide"></span></span>
    <button class="selectMenu openPopup rotableArrow" id="hideWatchVideos3">
      <span data-text="off"></span>
      <ul>
        <li value data-text="off"></li>
        <li value="All videos" data-text="watched_percentage">0-100</li>
        <li value="50-100%" data-text="watched_percentage">50-100</li>
        <li value="70-100%" data-text="watched_percentage">70-100</li>
        <li value="75-100%" data-text="watched_percentage">75-100</li>
        <li value="80-100%" data-text="watched_percentage">80-100</li>
        <li value="85-100%" data-text="watched_percentage">85-100</li>
        <li value="90-100%" data-text="watched_percentage">90-100</li>
        <li value="95-100%" data-text="watched_percentage">95-100</li>
        <li value="Only fully-watched videos" data-text="watched_percentage">100</li>
      </ul>
    </button>
  </label>
  <label>
    <span data-text="sidebar">: <span data-text="dim"></span></span>
    <button class="selectMenu openPopup rotableArrow" id="dimWatchVideos3">
      <span data-text="off"></span>
      <ul>
        <li value data-text="off"></li>
        <li value="dimAllVideos" data-text="watched_percentage">0-100</li>
        <li value="50-100%" data-text="watched_percentage">50-100</li>
        <li value="70-100%" data-text="watched_percentage">70-100</li>
        <li value="75-100%" data-text="watched_percentage">75-100</li>
        <li value="80-100%" data-text="watched_percentage">80-100</li>
        <li value="85-100%" data-text="watched_percentage">85-100</li>
        <li value="90-100%" data-text="watched_percentage">90-100</li>
        <li value="95-100%" data-text="watched_percentage">95-100</li>
        <li value="dimFullyWatchVideos" data-text="watched_percentage">100</li>
      </ul>
    </button>
  </label>
  <div class="expandable">
    <label>
      <span data-text="opacity"></span>
      <input type="number" id="watchVideoOpacity3" step="0.01" min="0" max="1" value="0.3">
      <button class="numInputBtn minus iconButton"></button>
      <button class="numInputBtn plus iconButton"></button>
    </label>
  </div>
</section>
